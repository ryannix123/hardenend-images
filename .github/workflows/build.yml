# =============================================================================
# Acme Insurance demo: build, push, scan and compare
#
# Builds each service twice from the same commit: once on UBI (Containerfile)
# and once on Red Hat Hardened Images (Containerfile.hardened). The two files
# differ only in the final FROM line, and the pipeline fails if that stops
# being true. After pushing, each image is scanned and the "compare" job
# prints one table with all four results.
#
# Triggers:
#   push to main       build + push + scan
#   pull_request       build, scan, and comment on the pull request with what it
#                      fixes: findings in the live image vs. this build
#   schedule (02:00)   nightly rebuild, so base image fixes are picked up
#                      without waiting for an application change
#   workflow_dispatch  manual run
#
# Secrets required (Settings -> Secrets -> Actions):
#   QUAY_USERNAME   Quay.io username or robot account
#   QUAY_PASSWORD   Quay.io password or robot token
#
# Everything is pushed to ONE repository, quay.io/ryan_nix/acme-insurance.
# Every tag names the service and the base image it was built on:
#   :web-ubi-latest,       :web-hardened-latest,
#   :quote-api-ubi-latest, :quote-api-hardened-latest   never expire
#   :<service>-<ubi|hardened>-YYYY.MM.DD                 expire after QUAY_TAG_TTL
#   :<service>-<ubi|hardened>-git-<short-sha>            expire after QUAY_TAG_TTL
# =============================================================================
name: Build, scan and compare

on:
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/build.yml"]
  pull_request:
    branches: [main]
    paths: ["services/**"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: quay.io
  NAMESPACE: ryan_nix
  QUAY_TAG_TTL: 14d

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ matrix.service }} on ${{ matrix.variant }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: quote-api
            variant: ubi
            tag_prefix: "ubi-"
            containerfile: Containerfile
            base_label: "UBI 9"
          - service: quote-api
            variant: hardened
            tag_prefix: "hardened-"
            containerfile: Containerfile.hardened
            base_label: "Red Hat Hardened Images"
          - service: web
            variant: ubi
            tag_prefix: "ubi-"
            containerfile: Containerfile
            base_label: "UBI 10"
          - service: web
            variant: hardened
            tag_prefix: "hardened-"
            containerfile: Containerfile.hardened
            base_label: "Red Hat Hardened Images"

    env:
      # One Quay repository for the whole demo. Services and variants are told
      # apart by tag prefix, the same scheme as the World Monitor project.
      IMAGE_NAME: acme-insurance
      IMAGE_REF: quay.io/ryan_nix/acme-insurance

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The demo's claim is that the two builds differ by one line. Enforce it.
      - name: Check the two Containerfiles differ only in the final FROM line
        working-directory: services/${{ matrix.service }}
        run: |
          strip() { grep -v -E '^#' "$1" | awk '/^FROM /{last=NR} {line[NR]=$0} END{for(i=1;i<=NR;i++) if(i!=last) print line[i]}'; }
          if ! diff <(strip Containerfile) <(strip Containerfile.hardened); then
            echo "::error::Containerfile and Containerfile.hardened differ beyond the final FROM line"
            exit 1
          fi

      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          DATE=$(date -u +%Y.%m.%d)
          PREFIX="${{ matrix.service }}-${{ matrix.tag_prefix }}"
          PUSH_LATEST=false
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            PUSH_LATEST=true
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE_REF}:${PREFIX}${DATE}"
            echo "${IMAGE_REF}:${PREFIX}git-${SHORT_SHA}"
            [[ "${PUSH_LATEST}" == "true" ]] && echo "${IMAGE_REF}:${PREFIX}latest"
            echo "EOF"
            echo "date_tag=${IMAGE_REF}:${PREFIX}${DATE}"
            echo "git_tag=${IMAGE_REF}:${PREFIX}git-${SHORT_SHA}"
            echo "latest_tag=${IMAGE_REF}:${PREFIX}latest"
            echo "push_latest=${PUSH_LATEST}"
            echo "date=${DATE}"
          } >> "${GITHUB_OUTPUT}"

          # The runtime base image, and the date Red Hat built it. The date goes into
          # the image so the site can show it: old before a remediation, recent after.
          BASE=$(grep -E '^FROM ' "services/${{ matrix.service }}/${{ matrix.containerfile }}" | tail -1 | awk '{print $2}')
          REF="${BASE}"
          # skopeo will not take name:tag@digest; the digest alone is the exact image.
          [[ "${REF}" == *@sha256:* ]] && REF=$(sed -E 's|:[^/@]+@|@|' <<<"${REF}")
          CREATED=$(skopeo inspect --no-tags --format '{{.Created}}' "docker://${REF}" 2>/dev/null \
                    || skopeo inspect --format '{{.Created}}' "docker://${REF}" 2>/dev/null \
                    || echo unknown)
          echo "Base image ${BASE} was built ${CREATED}"
          {
            echo "base=${BASE}"
            echo "created=${CREATED}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image with Buildah
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          context: services/${{ matrix.service }}
          containerfiles: services/${{ matrix.service }}/${{ matrix.containerfile }}
          platforms: linux/amd64
          build-args: |
            BASE_LABEL=${{ matrix.base_label }}
            BASE_CREATED=${{ steps.meta.outputs.created }}
          labels: |
            org.opencontainers.image.title=Acme Insurance ${{ matrix.service }}
            org.opencontainers.image.description=Acme Insurance demo ${{ matrix.service }} on ${{ matrix.base_label }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.base.name=${{ steps.meta.outputs.base }}

      # Quay reads quay.expires-after from an image's labels at push time.
      # The dated and git tags get the label; :latest must not.
      - name: Mark per-build tags to expire on Quay
        if: github.event_name != 'pull_request'
        env:
          TTL: ${{ env.QUAY_TAG_TTL }}
          DATE_TAG: ${{ steps.meta.outputs.date_tag }}
          GIT_TAG: ${{ steps.meta.outputs.git_tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          PUSH_LATEST: ${{ steps.meta.outputs.push_latest }}
        run: |
          set -euo pipefail
          ctr=$(buildah from --pull=never "${DATE_TAG}")
          buildah config --label "quay.expires-after=${TTL}" "${ctr}"
          buildah commit --quiet --format docker "${ctr}" "${DATE_TAG}" >/dev/null
          buildah rm "${ctr}" >/dev/null
          buildah tag "${DATE_TAG}" "${GIT_TAG}"

          label() { buildah inspect --type image \
            --format '{{ index .OCIv1.Config.Labels "quay.expires-after" }}' "$1"; }
          for T in "${DATE_TAG}" "${GIT_TAG}"; do
            [[ "$(label "$T")" == "${TTL}" ]] || { echo "::error::$T is missing quay.expires-after"; exit 1; }
          done
          if [[ "${PUSH_LATEST}" == "true" ]]; then
            L=$(label "${LATEST_TAG}")
            [[ -z "$L" || "$L" == "<no value>" ]] || { echo "::error::${LATEST_TAG} would expire"; exit 1; }
          fi

      - name: Push to Quay.io
        id: push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          # The tags are full names (quay.io/...), so no image or registry input.
          tags: ${{ steps.build.outputs.tags }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.git_tag }}
          format: spdx-json
          output-file: ${{ matrix.service }}-${{ matrix.variant }}.sbom.json
          artifact-name: sbom-${{ matrix.service }}-${{ matrix.variant }}
          registry-username: ${{ secrets.QUAY_USERNAME }}
          registry-password: ${{ secrets.QUAY_PASSWORD }}

      - name: Scan image
        id: scan
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.meta.outputs.git_tag }}
          # Report only. The comparison table is the output; findings never fail the build.
          fail-build: false
          output-format: json
          output-file: scan.json
        # Only needed if the Quay repository is private; harmless when it is public.
        env:
          GRYPE_REGISTRY_AUTH_AUTHORITY: quay.io
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ secrets.QUAY_USERNAME }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

      - name: Summarise findings
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          count() { jq --arg s "$1" '[.matches[] | select(.vulnerability.severity == $s)] | length' scan.json; }
          SIZE=$(buildah inspect --type image --format '{{ .Size }}' "${{ steps.meta.outputs.git_tag }}" 2>/dev/null || echo 0)
          PKGS=$(jq '.packages | length' "${{ matrix.service }}-${{ matrix.variant }}.sbom.json")
          jq -n \
            --arg service "${{ matrix.service }}" --arg variant "${{ matrix.variant }}" \
            --arg base "${{ steps.meta.outputs.base }}" \
            --argjson critical "$(count Critical)" --argjson high "$(count High)" \
            --argjson medium "$(count Medium)" --argjson low "$(count Low)" \
            --argjson packages "${PKGS}" --argjson size "${SIZE:-0}" \
            '{service:$service, variant:$variant, base:$base, critical:$critical, high:$high, medium:$medium, low:$low, packages:$packages, size:$size}' \
            > "result-${{ matrix.service }}-${{ matrix.variant }}.json"
          cat "result-${{ matrix.service }}-${{ matrix.variant }}.json"

      - name: Upload result
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.service }}-${{ matrix.variant }}
          path: result-${{ matrix.service }}-${{ matrix.variant }}.json

      # ---- Pull requests only: what would this change fix in what is running? ----
      # "Before" is the image running now (the :<service>-<variant>-latest tag on
      # Quay). "After" is this pull request's build, which is never pushed. Neither
      # needs Quay credentials, so this also works on Dependabot's pull requests.
      - name: Install Grype
        id: grype
        if: github.event_name == 'pull_request'
        uses: anchore/scan-action/download-grype@v7

      - name: Scan the live image and this build
        if: github.event_name == 'pull_request'
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          LIVE: ${{ steps.meta.outputs.latest_tag }}
          BUILT: ${{ steps.meta.outputs.git_tag }}
          AFTER_CREATED: ${{ steps.meta.outputs.created }}
        run: |
          set -euo pipefail
          buildah push --quiet "${BUILT}" "docker-archive:${RUNNER_TEMP}/after.tar"
          "${GRYPE}" "docker-archive:${RUNNER_TEMP}/after.tar" -o json --file after.json

          LIVE_FOUND=true
          if ! "${GRYPE}" "registry:${LIVE}" -o json --file before.json; then
            echo "::warning::${LIVE} could not be scanned (not pushed yet?)"
            echo '{"matches":[]}' > before.json
            LIVE_FOUND=false
          fi
          BEFORE_CREATED=$(skopeo inspect --config "docker://${LIVE}" 2>/dev/null \
            | jq -r '.config.Env[]? | select(startswith("BASE_CREATED=")) | sub("BASE_CREATED=";"")' \
            || true)

          jq -n \
            --arg service "${{ matrix.service }}" --arg variant "${{ matrix.variant }}" \
            --arg before_created "${BEFORE_CREATED:-unknown}" --arg after_created "${AFTER_CREATED}" \
            --argjson live_found "${LIVE_FOUND}" \
            --slurpfile b before.json --slurpfile a after.json '
            def count($r; $s): [$r[0].matches[] | select(.vulnerability.severity == $s)] | length;
            def counts($r): {critical: count($r; "Critical"), high: count($r; "High"),
                             medium: count($r; "Medium"), low: count($r; "Low")};
            def ids($r): [$r[0].matches[] | {id: .vulnerability.id,
                          severity: .vulnerability.severity, package: .artifact.name}] | unique;
            (ids($b)) as $B | (ids($a)) as $A |
            {service: $service, variant: $variant, live_found: $live_found,
             before_created: $before_created, after_created: $after_created,
             before: counts($b), after: counts($a),
             fixed: [$B[] | select(. as $v | ($A | index($v)) == null)],
             introduced: [$A[] | select(. as $v | ($B | index($v)) == null)]}' \
            > "pr-result-${{ matrix.service }}-${{ matrix.variant }}.json"
          jq '{service, variant, before, after, fixed: (.fixed | length), introduced: (.introduced | length)}' \
            "pr-result-${{ matrix.service }}-${{ matrix.variant }}.json"

      - name: Upload pull request result
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-result-${{ matrix.service }}-${{ matrix.variant }}
          path: pr-result-${{ matrix.service }}-${{ matrix.variant }}.json

  compare:
    name: Compare UBI and Hardened Images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && !cancelled()
    steps:
      - name: Download results
        uses: actions/download-artifact@v7
        with:
          pattern: result-*
          merge-multiple: true

      - name: Write comparison table
        run: |
          {
            echo "## Same commit, two base images"
            echo ""
            echo "| Service | Base | Critical | High | Medium | Low | Packages | Size (MB) |"
            echo "|---|---|---:|---:|---:|---:|---:|---:|"
            jq -r -s 'sort_by(.service, .variant) | reverse | .[] |
              "| \(.service) | \(.variant) | \(.critical) | \(.high) | \(.medium) | \(.low) | \(.packages) | \((.size / 1048576) | floor) |"' result-*.json
            echo ""
            echo "Findings are from Grype and package counts from Syft, both run against the pushed image."
            echo "A scanner can only count what it can read. If it does not fully support an image's"
            echo "package metadata, the number for that image is a floor, not a total."
          } >> "${GITHUB_STEP_SUMMARY}"

  pr-report:
    name: Comment on the pull request
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && !cancelled()
    permissions:
      contents: read
      pull-requests: write    # to post the comment, including on Dependabot's pull requests
    steps:
      - name: Download results
        uses: actions/download-artifact@v7
        with:
          pattern: pr-result-*
          merge-multiple: true

      - name: Write the report
        run: |
          set -euo pipefail
          jq -s 'sort_by(.service, .variant) | reverse' pr-result-*.json > all.json
          {
            echo "<!-- acme-cve-report -->"
            echo "## What this pull request fixes in what is running"
            echo ""
            echo "Live is the image running now. This PR is the image this pull request would ship."
            echo ""
            echo "| Service | Base | Base image built (live → this PR) | Critical | High | Medium | Low | Fixed | New |"
            echo "|---|---|---|---:|---:|---:|---:|---:|---:|"
            jq -r '.[] |
              def d(x): if x == "unknown" or x == "" then "?" else (x | .[0:10]) end;
              def c(k): "\(.before[k]) → \(.after[k])";
              "| \(.service) | \(.variant) | \(d(.before_created)) → \(d(.after_created)) | \(c("critical")) | \(c("high")) | \(c("medium")) | \(c("low")) | \(.fixed | length) | \(.introduced | length) |"' all.json
            echo ""
            FIXED=$(jq '[.[].fixed[] | select(.severity == "Critical" or .severity == "High")] | length' all.json)
            if [[ "${FIXED}" -gt 0 ]]; then
              echo "### Critical and high findings this pull request removes"
              echo ""
              jq -r '[.[] | .service as $s | .variant as $v | .fixed[]
                       | select(.severity == "Critical" or .severity == "High")
                       | "- **\(.id)** (\(.severity)) in `\(.package)`, \($s) on \($v)"]
                     | .[0:40][]' all.json
              [[ "${FIXED}" -gt 40 ]] && echo "- ...and $((FIXED - 40)) more"
              echo ""
            fi
            NEW=$(jq '[.[].introduced[]] | length' all.json)
            if [[ "${NEW}" -gt 0 ]]; then
              echo "### New findings in this build"
              echo ""
              jq -r '[.[] | .service as $s | .variant as $v | .introduced[]
                       | "- \(.id) (\(.severity)) in `\(.package)`, \($s) on \($v)"] | .[0:20][]' all.json
              echo ""
            fi
            if jq -e 'any(.[]; .live_found == false)' all.json >/dev/null; then
              echo "_Some live images could not be scanned, so their \"live\" column reads 0._"
              echo ""
            fi
            echo "<sub>Findings from Grype. A scanner counts only what it can read, so treat low numbers as a floor.</sub>"
          } > report.md
          cat report.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" --edit-last --body-file report.md 2>/dev/null \
            || gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" --body-file report.md
