# =============================================================================
# Acme Insurance demo: everything in one file
#
# Deploys the web front end, the pricing service and PostgreSQL into whatever
# project you are logged in to. Nothing to edit, no project name to pass, and
# the database password is generated for you.
#
#   Deploy (UBI build):
#     oc process -f deploy/acme-insurance.yaml | oc apply -f -
#
#   Deploy the Hardened Images build from the start:
#     oc process -f deploy/acme-insurance.yaml -p BASE=hardened | oc apply -f -
#
#   Open it:
#     oc get route acme-insurance -o jsonpath='https://{.spec.host}{"\n"}'
#
#   Remove it:
#     oc delete all,secret,pvc,networkpolicy -l app.kubernetes.io/part-of=acme-insurance
#
# Run the deploy command once. Each run generates a new database password; if
# you do run it again, restart the two pods that use it:
#     oc rollout restart deployment/acme-db deployment/quote-api
#
# GENERATED from deploy/db and deploy/base by scripts/build-template.py.
# Edit those files, then re-run the script; do not edit this file by hand.
# =============================================================================
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: acme-insurance
  annotations:
    openshift.io/display-name: Acme Insurance demo
    description: 'Car insurance demo: Node.js 24 front end, .NET 10 pricing service and PostgreSQL 16. Deploys into the current
      project.'
    tags: demo,dotnet,nodejs,postgresql
labels:
  app.kubernetes.io/part-of: acme-insurance
parameters:
  - name: BASE
    displayName: Base image
    description: '"ubi" for the UBI build, "hardened" for the Red Hat Hardened Images build.'
    value: ubi
    required: true
  - name: IMAGE_REPO
    displayName: Image repository
    description: Repository that holds all four images.
    value: quay.io/ryan_nix/acme-insurance
    required: true
  - name: DB_PASSWORD
    displayName: Database password
    description: Generated automatically. Never stored in Git.
    generate: expression
    from: '[a-zA-Z0-9]{24}'
    required: true
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: acme-db
    type: Opaque
    stringData:
      POSTGRESQL_USER: acme
      POSTGRESQL_PASSWORD: ${DB_PASSWORD}
      POSTGRESQL_DATABASE: acme
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: acme-db
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: acme-db
      labels:
        app: acme-db
        app.kubernetes.io/name: acme-db
        app.kubernetes.io/component: database
        app.openshift.io/runtime: postgresql
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: acme-db
      template:
        metadata:
          labels:
            app: acme-db
        spec:
          containers:
            - name: postgresql
              image: registry.redhat.io/rhel9/postgresql-16:latest
              ports:
                - containerPort: 5432
                  name: postgres
              envFrom:
                - secretRef:
                    name: acme-db
              volumeMounts:
                - name: data
                  mountPath: /var/lib/pgsql/data
              readinessProbe:
                exec:
                  command:
                    - /usr/libexec/check-container
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                exec:
                  command:
                    - /usr/libexec/check-container
                    - --live
                initialDelaySeconds: 30
                periodSeconds: 20
              resources:
                requests:
                  cpu: 50m
                  memory: 192Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: acme-db
  - apiVersion: v1
    kind: Service
    metadata:
      name: acme-db
    spec:
      selector:
        app: acme-db
      ports:
        - port: 5432
          targetPort: postgres
          name: postgres
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: quote-api
      labels:
        app: quote-api
        app.kubernetes.io/name: quote-api
        app.kubernetes.io/component: backend
        app.openshift.io/runtime: dotnet
      annotations:
        app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"acme-db"}]'
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: quote-api
      template:
        metadata:
          labels:
            app: quote-api
        spec:
          containers:
            - name: quote-api
              image: ${IMAGE_REPO}:quote-api-${BASE}-latest
              imagePullPolicy: Always
              ports:
                - containerPort: 8080
                  name: http
              env:
                - name: DB_HOST
                  value: acme-db
                - name: DB_PORT
                  value: '5432'
                - name: DB_NAME
                  valueFrom:
                    secretKeyRef:
                      name: acme-db
                      key: POSTGRESQL_DATABASE
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: acme-db
                      key: POSTGRESQL_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: acme-db
                      key: POSTGRESQL_PASSWORD
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: http
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 20
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 384Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: quote-api
    spec:
      selector:
        app: quote-api
      ports:
        - port: 8080
          targetPort: http
          name: http
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
      labels:
        app: web
        app.kubernetes.io/name: web
        app.kubernetes.io/component: frontend
        app.openshift.io/runtime: nodejs
      annotations:
        app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"quote-api"}]'
    spec:
      replicas: 2
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
            - name: web
              image: ${IMAGE_REPO}:web-${BASE}-latest
              imagePullPolicy: Always
              ports:
                - containerPort: 8080
                  name: http
              env:
                - name: API_URL
                  value: http://quote-api:8080
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 20
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 192Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
  - apiVersion: v1
    kind: Service
    metadata:
      name: web
    spec:
      selector:
        app: web
      ports:
        - port: 8080
          targetPort: http
          name: http
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: acme-insurance
    spec:
      to:
        kind: Service
        name: web
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: default-deny-ingress
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: db-from-quote-api
    spec:
      podSelector:
        matchLabels:
          app: acme-db
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: quote-api
          ports:
            - protocol: TCP
              port: 5432
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: web-from-router
    spec:
      podSelector:
        matchLabels:
          app: web
      policyTypes:
        - Ingress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  policy-group.network.openshift.io/ingress: ''
          ports:
            - protocol: TCP
              port: 8080
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: quote-api-from-web
    spec:
      podSelector:
        matchLabels:
          app: quote-api
      policyTypes:
        - Ingress
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: web
          ports:
            - protocol: TCP
              port: 8080
