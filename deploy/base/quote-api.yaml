apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
  labels:
    app: quote-api
    app.kubernetes.io/name: quote-api
    app.kubernetes.io/component: backend
    app.openshift.io/runtime: dotnet      # the icon in the console Topology view
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"acme-db"}]'
spec:
  replicas: 2
  selector:
    matchLabels: {app: quote-api}
  template:
    metadata:
      labels: {app: quote-api}
    spec:
      containers:
        - name: quote-api
          image: quay.io/ryan_nix/acme-insurance:quote-api-latest
          imagePullPolicy: Always
          ports:
            - {containerPort: 8080, name: http}
          env:
            - {name: DB_HOST, value: acme-db}
            - {name: DB_PORT, value: "5432"}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: acme-db, key: POSTGRESQL_DATABASE}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: acme-db, key: POSTGRESQL_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: acme-db, key: POSTGRESQL_PASSWORD}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: quote-api
spec:
  selector: {app: quote-api}
  ports:
    - {port: 8080, targetPort: http, name: http}
