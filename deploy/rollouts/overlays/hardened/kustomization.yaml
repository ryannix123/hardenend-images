apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The only difference from the ubi overlay is the image tag on each Rollout.
patches:
  - target:
      kind: Rollout
      name: web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: quay.io/ryan_nix/acme-insurance:web-hardened-latest
  - target:
      kind: Rollout
      name: quote-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: quay.io/ryan_nix/acme-insurance:quote-api-hardened-latest
