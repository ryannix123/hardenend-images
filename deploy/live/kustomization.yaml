apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD watches this directory. To ship a different build, change the one
# line below, commit and push. Argo CD syncs it and Argo Rollouts does the
# blue-green rollout.
#
#   ../rollouts/overlays/ubi        the UBI build
#   ../rollouts/overlays/hardened   the Red Hat Hardened Images build
resources:
  - ../rollouts/overlays/ubi
