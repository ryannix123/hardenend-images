apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: acme-db
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-db
  labels: {app: acme-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: acme-db}
  template:
    metadata:
      labels: {app: acme-db}
    spec:
      containers:
        - name: postgresql
          # Red Hat's PostgreSQL 16 image. OpenShift clusters can pull it with
          # the cluster pull secret.
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - {containerPort: 5432, name: postgres}
          envFrom:
            - secretRef: {name: acme-db}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
          readinessProbe:
            exec: {command: [/usr/libexec/check-container]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: {command: [/usr/libexec/check-container, --live]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: acme-db}
---
apiVersion: v1
kind: Service
metadata:
  name: acme-db
spec:
  selector: {app: acme-db}
  ports:
    - {port: 5432, targetPort: postgres, name: postgres}
