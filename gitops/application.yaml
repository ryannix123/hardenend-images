# Argo CD Application for the Acme Insurance demo (OpenShift GitOps).
#   oc apply -f gitops/application.yaml
# Change repoURL if you push this repository somewhere else.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acme-insurance
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ryannix123/hardenend-images.git
    targetRevision: main
    path: deploy/live
  destination:
    server: https://kubernetes.default.svc
    namespace: acme-insurance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Lets the default OpenShift GitOps instance manage this namespace.
        argocd.argoproj.io/managed-by: openshift-gitops
